server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-nomad
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # only ship containers labelled logging=promtail
      - source_labels: ['__meta_docker_container_label_logging']
        regex: 'promtail'
        action: keep
      # job and service come from the labels set in the Nomad job
      - source_labels: ['__meta_docker_container_label_job']
        target_label: job
      - source_labels: ['__meta_docker_container_label_service']
        target_label: service
      # container name (strip the leading "/")
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_name']
        regex: '/.+-([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
        target_label: nomad_alloc_id
    pipeline_stages:
      - docker: {}