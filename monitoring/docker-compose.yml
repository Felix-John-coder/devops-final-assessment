
services:
  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    command: agent -dev -client=0.0.0.0 -ui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8500:8500"
    volumes:
      - consul-data:/consul/data
    restart: unless-stopped

  nomad:
    image: hashicorp/nomad:2.1.1
    container_name: nomad
    privileged: true
    cgroup: host
    command: agent -dev -bind=0.0.0.0 -config=/etc/nomad.d/nomad.hcl
    ports:
      - "4646:4646"
    volumes:
      - ../nomad/nomad.hcl:/etc/nomad.d/nomad.hcl:ro
      - nomad-data:/nomad/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      - consul
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # Where Docker stores each container's json log files on the host.
      - promtail-positions:/tmp
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"          
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Auto-creates the Loki data source on startup, so no manual clicking.
      - ./grafana.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped 
    
 
volumes:
  consul-data:
  nomad-data:
  loki-data:
  promtail-positions:
  grafana-data:


  